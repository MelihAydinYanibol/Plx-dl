<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plx-dl · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e5a00d'/%3E%3Cpath d='M12 8v16l12-8z' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-2: #efede8;
    --border: #e1ded7;
    --text: #1b1a17;
    --muted: #6d6a62;
    --accent: #c98a00;
    --accent-strong: #e5a00d;
    --on-accent: #1b1a17;
    --bad: #c23b31;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px rgb(0 0 0 / 0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121210;
      --surface: #1b1a18;
      --surface-2: #252421;
      --border: #302e2a;
      --text: #eceae4;
      --muted: #9a968c;
      --accent: #e5a00d;
      --accent-strong: #f0b43a;
      --on-accent: #16140f;
      --bad: #f06a5f;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121210;
    --surface: #1b1a18;
    --surface-2: #252421;
    --border: #302e2a;
    --text: #eceae4;
    --muted: #9a968c;
    --accent: #e5a00d;
    --accent-strong: #f0b43a;
    --on-accent: #16140f;
    --bad: #f06a5f;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); padding: 28px 24px 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-strong); display: grid; place-items: center; flex: none; }
  .logo svg { width: 16px; height: 16px; margin-left: 2px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button {
    width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px; cursor: pointer;
    background: var(--accent-strong); color: var(--on-accent); margin-top: 4px;
  }
  button:hover { filter: brightness(1.05); }
  .error {
    color: var(--bad); font-size: 13px; margin: 0 0 14px; padding: 8px 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--bad) 10%, transparent);
  }
</style>
<script>
  try { const t = localStorage.getItem("plx-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z" fill="#16140f"/></svg></div>
      <div>
        <h1>plx-dl</h1>
        <div class="sub">Sign in to continue</div>
      </div>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
<script>
  const error = new URLSearchParams(location.search).get("error");
  const messages = {
    invalid: "Wrong username or password.",
    locked: "Too many failed attempts. Try again in a few minutes.",
  };
  if (messages[error]) {
    const box = document.getElementById("error");
    box.textContent = messages[error];
    box.hidden = false;
  }
</script>
</body>
</html>
